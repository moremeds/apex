# herd.toml — herdr workers this repo's lead may drive. See cstack/skills/herd.
# Peer sessions are not listed: every live session under ~/projects is a peer.
# never: src/backtest/**, src/domain/backtest/** (frozen), config/secrets.yaml, the livewire lake

[[worker]]
name = "reviewer"
kind = "cursor"
role = "cross-lineage reviewer, read-only"
machine = "local"
args = ["--force", "--model", "cursor-grok-4.6-high"]

[[worker]]
name = "implementer"
kind = "devin"
role = "scoped implementation with tests, one plan task per dispatch"
machine = "local"
args = ["--permission-mode", "auto"]
preapproved = ["ls", "cat", "find", "head", "wc", "git log", "git status", "git diff", "make lint", "uv run pytest tests/unit/ --no-cov"]

[[worker]]
name = "mini-runner"
kind = "devin"
role = "verify the deployed container on the production box; read-only unless the plan says otherwise"
machine = "macmini"            # `herdr machine list`; control via: ssh macmini herdr agent ...
args = ["--permission-mode", "auto"]
preapproved = ["ls", "cat", "head", "wc", "docker ps", "docker logs", "curl -s http://127.0.0.1:8322"]
